<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки - Isterika Panel</title>
    <link rel="icon" type="image/png" href="{{ secret_url_for('static', filename='logo.png') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 50%, #1a1a1a 100%);
            background-attachment: fixed;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 111, 67, 0.5);
            box-shadow: 0 0 20px rgba(255, 111, 67, 0.3);
        }

        .accent-coral {
            color: #ff7043;
        }

        .bg-accent-coral {
            background-color: #ff7043;
        }

        .sidebar {
            width: 80px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sidebar-item {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .sidebar-item:hover {
            background: rgba(255, 111, 67, 0.1);
            border: 1px solid rgba(255, 111, 67, 0.3);
            box-shadow: 0 0 20px rgba(255, 111, 67, 0.2);
        }

        .sidebar-item.active {
            background: rgba(255, 111, 67, 0.15);
            border: 1px solid rgba(255, 111, 67, 0.4);
            box-shadow: 0 0 30px rgba(255, 111, 67, 0.3);
        }

        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="min-h-screen text-white overflow-hidden" x-data="settings()">

    <div class="flex h-screen">

        <!-- Sidebar -->
        <div class="sidebar flex flex-col items-center py-8 space-y-6">
            <div class="sidebar-item flex items-center justify-center mb-4">
                <img src="{{ secret_url_for('static', filename='logo.png') }}" alt="Logo" class="w-8 h-8">
            </div>

            <div class="sidebar-item flex items-center justify-center" @click="window.location.href='{{ secret_url_for('dashboard') }}'" title="Панель управления">
                <svg class="w-6 h-6 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
            </div>

            <div class="sidebar-item flex items-center justify-center" @click="window.location.href='{{ secret_url_for('dashboard') }}'" title="Пользователи">
                <svg class="w-6 h-6 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
            </div>

            <div class="sidebar-item active flex items-center justify-center mt-auto" title="Настройки">
                <svg class="w-6 h-6 accent-coral" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </div>

            <div class="sidebar-item flex items-center justify-center" @click="logout()" title="Выход">
                <svg class="w-6 h-6 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-y-auto p-8">
            <div class="max-w-4xl mx-auto">

                <div class="mb-8">
                    <h1 class="text-4xl font-bold text-white mb-2">Настройки</h1>
                    <p class="text-white/50">Управление учетной записью и безопасностью</p>
                </div>

                <div class="space-y-6">

                    <!-- Change Password -->
                    <div class="glass p-6">
                        <h2 class="text-2xl font-bold mb-6 accent-coral">Изменить пароль</h2>
                        <form @submit.prevent="changePassword">
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-white/70 mb-2 text-sm font-medium">Текущий пароль</label>
                                    <input type="password" x-model="passwordForm.current" required class="w-full px-4 py-3 glass-input rounded-xl text-white placeholder-white/40 outline-none">
                                </div>
                                <div>
                                    <label class="block text-white/70 mb-2 text-sm font-medium">Новый пароль</label>
                                    <input type="password" x-model="passwordForm.new" required class="w-full px-4 py-3 glass-input rounded-xl text-white placeholder-white/40 outline-none">
                                </div>
                                <div>
                                    <label class="block text-white/70 mb-2 text-sm font-medium">Подтвердите новый пароль</label>
                                    <input type="password" x-model="passwordForm.confirm" required class="w-full px-4 py-3 glass-input rounded-xl text-white placeholder-white/40 outline-none">
                                </div>
                                <button type="submit" class="w-full px-6 py-3 bg-accent-coral rounded-xl hover:shadow-lg hover:shadow-coral/30 transition-all duration-300 font-semibold">
                                    Сохранить пароль
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Change Username -->
                    <div class="glass p-6">
                        <h2 class="text-2xl font-bold mb-6 accent-coral">Изменить имя пользователя</h2>
                        <form @submit.prevent="changeUsername">
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-white/70 mb-2 text-sm font-medium">Новое имя пользователя</label>
                                    <input type="text" x-model="usernameForm.new" required class="w-full px-4 py-3 glass-input rounded-xl text-white placeholder-white/40 outline-none">
                                </div>
                                <div>
                                    <label class="block text-white/70 mb-2 text-sm font-medium">Подтвердите паролем</label>
                                    <input type="password" x-model="usernameForm.password" required class="w-full px-4 py-3 glass-input rounded-xl text-white placeholder-white/40 outline-none">
                                </div>
                                <button type="submit" class="w-full px-6 py-3 bg-accent-coral rounded-xl hover:shadow-lg hover:shadow-coral/30 transition-all duration-300 font-semibold">
                                    Сохранить имя пользователя
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Secret Path -->
                    <div class="glass p-6">
                        <h2 class="text-2xl font-bold mb-4 accent-coral">Секретный путь</h2>
                        <div class="glass-card p-4 mb-4">
                            <p class="text-white/70 text-sm mb-2">Текущий путь:</p>
                            <p class="text-xl font-mono accent-coral" x-text="'/' + secretPath"></p>
                        </div>
                        <form @submit.prevent="changeSecretPath">
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-white/70 mb-2 text-sm font-medium">Новый секретный путь</label>
                                    <input type="text" x-model="secretPathForm.new" required class="w-full px-4 py-3 glass-input rounded-xl text-white placeholder-white/40 outline-none">
                                </div>
                                <div>
                                    <label class="block text-white/70 mb-2 text-sm font-medium">Подтвердите паролем</label>
                                    <input type="password" x-model="secretPathForm.password" required class="w-full px-4 py-3 glass-input rounded-xl text-white placeholder-white/40 outline-none">
                                </div>
                                <button type="submit" class="w-full px-6 py-3 bg-accent-coral rounded-xl hover:shadow-lg hover:shadow-coral/30 transition-all duration-300 font-semibold">
                                    Сохранить путь
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Blocked IPs -->
                    <div class="glass p-6">
                        <h2 class="text-2xl font-bold mb-4 accent-coral">Заблокированные IP</h2>
                        <div class="space-y-3" x-show="Object.keys(blockedIPs).length > 0">
                            <template x-for="(data, ip) in blockedIPs" :key="ip">
                                <div class="glass-card p-4 flex items-center justify-between">
                                    <div>
                                        <p class="font-mono text-white" x-text="ip"></p>
                                        <p class="text-sm text-white/50" x-text="'Попыток: ' + data.count"></p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-sm text-red-400" x-text="'Разблокировка через ' + data.remaining + ' сек'"></p>
                                    </div>
                                </div>
                            </template>
                        </div>
                        <p class="text-white/50 text-center py-8" x-show="Object.keys(blockedIPs).length === 0">
                            Нет заблокированных IP адресов
                        </p>
                    </div>

                </div>

            </div>
        </div>

    </div>

    <!-- Message Modal -->
    <div x-show="showMessageModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);">
        <div class="glass p-8 max-w-md w-full">
            <h2 class="text-2xl font-bold mb-4" :class="messageType === 'success' ? 'text-green-400' : 'text-red-400'" x-text="messageType === 'success' ? 'Успешно' : 'Ошибка'"></h2>
            <p class="text-white/70 mb-6" x-text="messageText"></p>
            <button @click="showMessageModal = false" class="w-full px-6 py-3 bg-accent-coral rounded-xl hover:shadow-lg transition-all font-semibold">
                OK
            </button>
        </div>
    </div>

    <script>
        const csrfToken = '{{ csrf_token() }}';

        function fetchWithCSRF(url, options = {}) {
            if (options.method && ['POST', 'PUT', 'DELETE', 'PATCH'].includes(options.method.toUpperCase())) {
                options.headers = options.headers || {};
                options.headers['X-CSRF-Token'] = csrfToken;
            }
            return fetch(url, options);
        }

        function settings() {
            return {
                passwordForm: { current: '', new: '', confirm: '' },
                usernameForm: { new: '', password: '' },
                secretPath: '',
                secretPathForm: { new: '', password: '' },
                blockedIPs: {},
                showMessageModal: false,
                messageType: 'success',
                messageText: '',

                async init() {
                    await this.loadSecretPath();
                    await this.loadBlockedIPs();
                    setInterval(() => this.loadBlockedIPs(), 5000);
                },

                async loadSecretPath() {
                    try {
                        const res = await fetch('/api/settings/secret-path');
                        const data = await res.json();
                        this.secretPath = data.secret_path;
                    } catch (e) {
                        console.error('Failed to load secret path:', e);
                    }
                },

                async loadBlockedIPs() {
                    try {
                        const res = await fetch('/api/security/blocked-ips');
                        this.blockedIPs = await res.json();
                    } catch (e) {
                        console.error('Failed to load blocked IPs:', e);
                    }
                },

                async changePassword() {
                    if (this.passwordForm.new !== this.passwordForm.confirm) {
                        this.showMessage('error', 'Новые пароли не совпадают');
                        return;
                    }

                    try {
                        const res = await fetchWithCSRF('/api/settings/password', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                current_password: this.passwordForm.current,
                                new_password: this.passwordForm.new
                            })
                        });
                        const data = await res.json();
                        if (data.success) {
                            this.showMessage('success', 'Пароль успешно изменен');
                            this.passwordForm = { current: '', new: '', confirm: '' };
                        } else {
                            this.showMessage('error', data.error || 'Не удалось изменить пароль');
                        }
                    } catch (e) {
                        this.showMessage('error', 'Ошибка при изменении пароля');
                    }
                },

                async changeUsername() {
                    try {
                        const res = await fetchWithCSRF('/api/settings/username', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                new_username: this.usernameForm.new,
                                password: this.usernameForm.password
                            })
                        });
                        const data = await res.json();
                        if (data.success) {
                            this.showMessage('success', 'Имя пользователя успешно изменено. Войдите заново.');
                            setTimeout(() => {
                                window.location.href = '{{ secret_url_for('logout') }}';
                            }, 2000);
                        } else {
                            this.showMessage('error', data.error || 'Не удалось изменить имя пользователя');
                        }
                    } catch (e) {
                        this.showMessage('error', 'Ошибка при изменении имени пользователя');
                    }
                },

                async changeSecretPath() {
                    try {
                        const res = await fetchWithCSRF('/api/settings/secret-path', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                new_secret_path: this.secretPathForm.new,
                                password: this.secretPathForm.password
                            })
                        });
                        const data = await res.json();
                        if (data.success) {
                            this.showMessage('success', 'Секретный путь изменен. Новый URL: ' + data.new_url);
                            setTimeout(() => {
                                window.location.href = data.new_url;
                            }, 2000);
                        } else {
                            this.showMessage('error', data.error || 'Не удалось изменить секретный путь');
                        }
                    } catch (e) {
                        this.showMessage('error', 'Ошибка при изменении секретного пути');
                    }
                },

                showMessage(type, text) {
                    this.messageType = type;
                    this.messageText = text;
                    this.showMessageModal = true;
                },

                logout() {
                    window.location.href = '{{ secret_url_for('logout') }}';
                }
            }
        }
    </script>
</body>
</html>
