<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Isterika Panel</title>
    <link rel="icon" type="image/png" href="{{ secret_url_for('static', filename='logo.png') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 50%, #1a1a1a 100%);
            background-attachment: fixed;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 111, 67, 0.5);
            box-shadow: 0 0 20px rgba(255, 111, 67, 0.3);
        }

        .accent-coral {
            color: #ff7043;
        }

        .bg-accent-coral {
            background-color: #ff7043;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .logo-pulse {
            animation: logoPulse 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-white">
    <div class="w-full max-w-md fade-in">
        <div class="glass p-8 shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-32 h-32 mx-auto mb-4 glass p-4 logo-pulse">
                    <img src="{{ secret_url_for('static', filename='logo.png') }}" alt="Logo" class="w-full h-full object-contain">
                </div>
                <h1 class="text-5xl font-bold accent-coral mb-2">Isterika</h1>
                <p class="text-white/70 font-medium">Панель управления Hysteria 2</p>
            </div>

            {% if error %}
            <div class="glass-input border-red-400/50 text-red-300 px-4 py-3 rounded-xl mb-6">
                <div class="flex items-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span>{{ error }}</span>
                </div>
            </div>
            {% endif %}

            <form method="POST" action="{{ secret_url_for('login') }}">
                <div class="space-y-6">
                    <div>
                        <label for="username" class="block text-sm font-semibold text-white/80 mb-2">
                            Имя пользователя
                        </label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                            class="w-full px-4 py-3 glass-input rounded-xl text-white placeholder-white/40 outline-none"
                            placeholder="Введите имя пользователя"
                        >
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-semibold text-white/80 mb-2">
                            Пароль
                        </label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            class="w-full px-4 py-3 glass-input rounded-xl text-white placeholder-white/40 outline-none"
                            placeholder="Введите пароль"
                        >
                    </div>

                    <button
                        type="submit"
                        class="w-full bg-accent-coral text-white font-bold py-3 px-4 rounded-xl hover:shadow-2xl hover:shadow-coral/30 transition-all duration-300"
                    >
                        Войти
                    </button>
                </div>
            </form>
        </div>

        <div class="text-center mt-6 text-white/50 text-sm glass rounded-2xl p-3">
            <p class="font-medium">Isterika Panel v2.0</p>
        </div>
    </div>
</body>
</html>
